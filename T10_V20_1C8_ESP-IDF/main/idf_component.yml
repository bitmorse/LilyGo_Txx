## Managed component dependencies (fetched by the IDF Component Manager on build).
dependencies:
  idf: ">=5.1"
  # LVGL 9 embedded GUI. Configured via Kconfig (see sdkconfig.defaults) so no
  # manual lv_conf.h is needed.
  lvgl/lvgl: "^9.2"
  # Fixed-point MP3 decoder (internet radio prototype).
  chmorgan/esp-libhelix-mp3: "^1.0.0"
  # mDNS (moved out of IDF core in 5.x) so the sync file server is reachable at
  # http://t10.local:8080 — convenience for discovery/testing.
  espressif/mdns: "^1.2"
