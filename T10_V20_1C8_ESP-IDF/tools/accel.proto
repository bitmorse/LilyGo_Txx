syntax = "proto3";

package vibration;

// A batch of accelerometer samples captured at a fixed rate. Batching keeps the
// MCAP message rate low (~8/s at 4 kHz) while the packed float arrays store the
// raw waveform for offline FFT / vibration analysis.
message AccelBatch {
  // UTC time of the FIRST sample in this batch, nanoseconds since the Unix epoch.
  fixed64 t0_ns = 1;
  // Nominal sample rate, Hz. Sample n has time t0_ns + round(n * 1e9 / rate_hz).
  uint32 rate_hz = 2;
  // Acceleration per sample, in g (1 g = 9.80665 m/s^2). x/y/z are equal length.
  repeated float x = 3;
  repeated float y = 4;
  repeated float z = 5;
}

// A batch of the slow auxiliary IMU channels (gyro + magnetometer + die temp),
// logged at ~100 Hz (the AK8963 magnetometer's maximum). Same batching/timing
// convention as AccelBatch. All arrays are the same length.
message ImuAux {
  fixed64 t0_ns  = 1;
  uint32  rate_hz = 2;
  repeated float gx = 3;      // angular rate, deg/s
  repeated float gy = 4;
  repeated float gz = 5;
  repeated float mx = 6;      // magnetic field, microtesla
  repeated float my = 7;
  repeated float mz = 8;
  repeated float temp_c = 9;  // die temperature, deg C
}
